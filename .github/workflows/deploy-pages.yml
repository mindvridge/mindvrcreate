name: Deploy to GitHub Pages

# GITHUB_TOKEN으로는 Pages 사이트 생성 API를 호출할 수 없어,
# gh-pages 브랜치에 정적 빌드를 푸시하는 방식을 사용한다.
# (gh-pages 브랜치가 생기면 GitHub가 Pages를 자동 활성화)
on:
  push:
    branches: [claude/homepage-creation-qmxyxf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /mindvrcreate
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
