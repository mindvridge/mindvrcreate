name: Deploy to GitHub Pages

# GITHUB_TOKEN으로는 Pages 사이트 생성 API를 호출할 수 없어,
# gh-pages 브랜치에 정적 빌드를 푸시하는 방식을 사용한다.
# (Pages 활성화 후 mindvridge.github.io/mindvrcreate 로 서빙)
#
# preview/ 는 Pages 활성화 전에도 외부에서 테스트할 수 있도록
# raw.githack.com 경로(/mindvridge/mindvrcreate/gh-pages/preview)에
# 맞춘 base path로 빌드한 사본이다.
on:
  push:
    branches: [claude/homepage-creation-qmxyxf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build && mv out site
        env:
          NEXT_PUBLIC_BASE_PATH: /mindvrcreate
      - name: Build relocatable preview (works on any CDN path)
        # 어떤 호스트·경로에서도 열리도록 자산 경로를 상대경로로 재작성한다.
        # raw.githack.com / cdn.statically.io 둘 다 이 빌드 하나로 서빙.
        run: |
          npm run build
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.txt' \) \
            -exec sed -i 's|"/__PREVIEW__/|"./|g; s|/__PREVIEW__/|./|g; s|"/__PREVIEW__"|"."|g' {} +
          mkdir -p site/preview
          cp -r out/. site/preview/
          cp -r out/. site/p 2>/dev/null || { mkdir -p site/p && cp -r out/. site/p/; }
        env:
          NEXT_PUBLIC_BASE_PATH: /__PREVIEW__
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
